services:
  postgres:
    image: postgres:15-alpine
    container_name: bbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bbg_db
    ports:
      - "5432:5432"
    volumes:
      - bbg_pgdata:/var/lib/postgresql/data

volumes:
  bbg_pgdata:
